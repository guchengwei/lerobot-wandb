name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e '.[test]' ruff==0.12.10
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .

  tests:
    name: tests / py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python ${{ matrix.python-version }} .venv
      - run: uv pip install --python .venv/bin/python -e '.[test]'
      - run: .venv/bin/python -m pytest -q

  build:
    name: build and install-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python build==1.3.0
      - run: .venv/bin/python -m build --outdir dist
      - run: .venv/bin/python scripts/check_wheel.py dist/*.whl dist/*.tar.gz
      - run: uv pip install --python .venv/bin/python dist/*.whl
      - run: uv pip check --python .venv/bin/python
      - run: .venv/bin/lerobot-wandb --help
      - run: .venv/bin/python -c 'import lerobot_wandb; print(lerobot_wandb.__version__)'
      - name: uninstall built wheel with documented uv route
        run: |
          uv pip uninstall --python .venv/bin/python lerobot-wandb
          test ! -e .venv/bin/lerobot-wandb
          .venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import importlib.util

          assert importlib.util.find_spec("lerobot_wandb") is None
          try:
              metadata.distribution("lerobot-wandb")
          except metadata.PackageNotFoundError:
              pass
          else:
              raise SystemExit("lerobot-wandb distribution metadata survived uninstall")
          PY
      - name: fresh built wheel [lerobot] install
        run: LEROBOT_VERSION=0.6.1 PYTHON_BIN=.venv/bin/python bash scripts/fresh_extra_smoke.sh dist/*.whl

  upstream-compatibility:
    name: upstream LeRobot ${{ matrix.lerobot-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Only an existing, release-tested LeRobot version is a blocking job. Add
        # future releases here after they exist and pass the compatibility checks.
        lerobot-version: ["0.6.1"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python 'lerobot==${{ matrix.lerobot-version }}'
      - run: uv pip install --python .venv/bin/python -e '.[test]'
      - run: uv pip check --python .venv/bin/python
      - run: .venv/bin/lerobot-wandb --help
      - run: .venv/bin/python -m pytest -q

  upstream-main-early-warning:
    name: upstream LeRobot main (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python 'lerobot @ git+https://github.com/huggingface/lerobot.git@main'
      - run: uv pip install --python .venv/bin/python -e .
      - run: .venv/bin/lerobot-wandb --help

  coexistence:
    name: coexistence and uninstall smoke
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: LEROBOT_VERSION=0.6.1 bash scripts/coexistence_smoke.sh
