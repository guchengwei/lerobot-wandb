<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">LeRobot W&amp;B companion workflow（日本語）</title>
  <desc id="desc">Companion command sequence: W&amp;B dataset Artifact -&gt; dataset download/materialize -&gt; local dataset tree -&gt; upstream lerobot-train --dataset.root -&gt; local trained model -&gt; model upload/promote。No automatic training lifecycle。W&amp;B dataset Artifact を local LeRobot dataset tree に materialize し、upstream training を実行して local model を別途 upload または promote する手動 workflow。rollout preview は任意の Run Media。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563" />
    </marker>
    <style>
      .title { font: 700 28px 'Noto Sans JP', 'DejaVu Sans', sans-serif; fill: #111827; }
      .subtitle { font: 16px 'Noto Sans JP', 'DejaVu Sans', sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .label { font: 700 17px 'Noto Sans JP', 'DejaVu Sans', sans-serif; fill: #111827; text-anchor: middle; }
      .small { font: 14px 'Noto Sans JP', 'DejaVu Sans', sans-serif; fill: #374151; text-anchor: middle; }
      .arrow { stroke: #4b5563; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .optional { fill: #f9fafb; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 6; rx: 12; }
      .optional-label { font: 700 16px 'Noto Sans JP', 'DejaVu Sans', sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f3f4f6" />
  <text x="60" y="58" class="title">LeRobot W&amp;B companion command の境界</text>
  <text x="60" y="88" class="subtitle">手動 transfer のみ — monkey-patching と automatic training lifecycle はありません</text>

  <rect x="45" y="125" width="190" height="110" class="box" />
  <text x="140" y="168" class="label">W&amp;B dataset Artifact</text>
  <text x="140" y="198" class="small">immutable bytes</text>

  <rect x="280" y="125" width="210" height="110" class="box" />
  <text x="385" y="160" class="label">dataset</text>
  <text x="385" y="186" class="label">download/materialize</text>
  <text x="385" y="214" class="small">lerobot-wandb</text>

  <rect x="535" y="125" width="190" height="110" class="box" />
  <text x="630" y="168" class="label">local dataset tree</text>
  <text x="630" y="198" class="small">local disk</text>

  <rect x="770" y="125" width="220" height="110" class="box" />
  <text x="880" y="160" class="label">upstream lerobot-train</text>
  <text x="880" y="186" class="label">--dataset.root</text>
  <text x="880" y="214" class="small">通常の LeRobot</text>

  <rect x="1035" y="125" width="120" height="110" class="box" />
  <text x="1095" y="168" class="label">local</text>
  <text x="1095" y="194" class="label">trained model</text>

  <path d="M235 180 H280" class="arrow" />
  <path d="M490 180 H535" class="arrow" />
  <path d="M725 180 H770" class="arrow" />
  <path d="M990 180 H1035" class="arrow" />

  <rect x="420" y="310" width="360" height="115" class="box" />
  <text x="600" y="354" class="label">model upload/promote</text>
  <text x="600" y="384" class="small">lerobot-wandb · 別の command</text>
  <text x="600" y="408" class="small">promote では model byte を送信しない</text>
  <path d="M1095 235 C1095 275 600 275 600 310" class="arrow" />

  <rect x="75" y="515" width="1050" height="170" class="optional" />
  <text x="105" y="550" class="optional-label">OPTIONAL ROLLOUT PREVIEW (Run Media のみ)</text>
  <text x="105" y="578" class="subtitle">local model の download 後、upstream rollout は local tree に書き込み、upload は別の手動 step です。</text>
  <text x="105" y="625" class="small" text-anchor="start">local model → lerobot-rollout → local rollout tree → lerobot-wandb rollout upload</text>
  <text x="105" y="655" class="small" text-anchor="start">browser 用 preview は表示用 derivative で、canonical training data ではありません。</text>
</svg>
